name: Manya Sync Hub v11.0 • Sincronización Automática Zero-Hardcode

on:
  schedule:
    # Ejecuta cada 2 horas en el minuto 22 (escalonado respecto a tareas locales)
    - cron: '22 */2 * * *'
  workflow_dispatch: # Permite ejecución manual con un click desde GitHub

permissions:
  contents: write

concurrency:
  group: manya-sync-main
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  sync-manya-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Sintaxis Python de Módulos Activos
        run: |
          python -m py_compile automation/manya_logging.py automation/manya_match_engine.py automation/manya_sports_press.py automation/manya_rival_intelligence.py automation/extraer_datos_1891.py automation/generar_cronica_gemini_narrativa.py automation/sync_manya_hub.py

      - name: Ejecutar Manya Sync Hub v11.0 (Modo CI)
        run: |
          python automation/sync_manya_hub.py --mode ci

      - name: Ejecutar Batería de Pruebas Dinámica v11.0
        run: |
          python automation/test_tactical_board.py
          python automation/test_editorial_coherence.py
          python automation/test_manya_ecosystem.py

      - name: Commit y Push Anti-Spam (Solo Cambios Reales)
        run: |
          git config user.name "Manya Sync Hub [GitHub Actions]"
          git config user.email "bot@manya.servicioti.com.uy"
          git add data/ assets/ index.html
          git reset -- data/health_status.json data/.sync_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios semánticos reales en datos ni SSR. Cero commits innecesarios."
          else
            git commit -m "chore(sync-hub): actualización automática Match Center, tablas y prensa v11.0 [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
