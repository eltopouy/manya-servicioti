    <rect x="20" y="32" width="80" height="56" rx="8" fill="#09090b" fill-opacity="0.92" stroke="#ffd100" stroke-width="2"/>
    <text x="60" y="58" fill="#ffd100" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="1">PyD</text>
    <text x="60" y="76" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="1.5">PADRE Y DECANO</text>
